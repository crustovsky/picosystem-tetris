<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="240" height="240" fill="#f0f0f0"/>
  
  <!-- Game title -->
  <rect x="0" y="0" width="240" height="20" fill="#333333"/>
  <text x="120" y="15" font-family="Arial" font-size="14" fill="white" text-anchor="middle">TETRIS</text>
  
  <!-- Main game area -->
  <rect x="10" y="25" width="150" height="200" fill="#222222" stroke="#333333" stroke-width="2"/>
  
  <!-- Tetris grid - 10x20 cells, each 15x10 pixels -->
  <g stroke="#444444" stroke-width="0.5">
    <!-- Vertical grid lines -->
    <line x1="25" y1="25" x2="25" y2="225" />
    <line x1="40" y1="25" x2="40" y2="225" />
    <line x1="55" y1="25" x2="55" y2="225" />
    <line x1="70" y1="25" x2="70" y2="225" />
    <line x1="85" y1="25" x2="85" y2="225" />
    <line x1="100" y1="25" x2="100" y2="225" />
    <line x1="115" y1="25" x2="115" y2="225" />
    <line x1="130" y1="25" x2="130" y2="225" />
    <line x1="145" y1="25" x2="145" y2="225" />

    <!-- Horizontal grid lines -->
    <line x1="10" y1="35" x2="160" y2="35" />
    <line x1="10" y1="45" x2="160" y2="45" />
    <line x1="10" y1="55" x2="160" y2="55" />
    <line x1="10" y1="65" x2="160" y2="65" />
    <line x1="10" y1="75" x2="160" y2="75" />
    <line x1="10" y1="85" x2="160" y2="85" />
    <line x1="10" y1="95" x2="160" y2="95" />
    <line x1="10" y1="105" x2="160" y2="105" />
    <line x1="10" y1="115" x2="160" y2="115" />
    <line x1="10" y1="125" x2="160" y2="125" />
    <line x1="10" y1="135" x2="160" y2="135" />
    <line x1="10" y1="145" x2="160" y2="145" />
    <line x1="10" y1="155" x2="160" y2="155" />
    <line x1="10" y1="165" x2="160" y2="165" />
    <line x1="10" y1="175" x2="160" y2="175" />
    <line x1="10" y1="185" x2="160" y2="185" />
    <line x1="10" y1="195" x2="160" y2="195" />
    <line x1="10" y1="205" x2="160" y2="205" />
    <line x1="10" y1="215" x2="160" y2="215" />
  </g>
  
  <!-- Example Tetris blocks with different colors -->
  <rect x="25" y="195" width="15" height="10" fill="#00FFFF" stroke="#333333" stroke-width="0.5"/> <!-- I piece -->
  <rect x="40" y="195" width="15" height="10" fill="#00FFFF" stroke="#333333" stroke-width="0.5"/>
  <rect x="55" y="195" width="15" height="10" fill="#00FFFF" stroke="#333333" stroke-width="0.5"/>
  <rect x="70" y="195" width="15" height="10" fill="#00FFFF" stroke="#333333" stroke-width="0.5"/>
  
  <rect x="85" y="215" width="15" height="10" fill="#FFFF00" stroke="#333333" stroke-width="0.5"/> <!-- O piece -->
  <rect x="100" y="215" width="15" height="10" fill="#FFFF00" stroke="#333333" stroke-width="0.5"/>
  <rect x="85" y="205" width="15" height="10" fill="#FFFF00" stroke="#333333" stroke-width="0.5"/>
  <rect x="100" y="205" width="15" height="10" fill="#FFFF00" stroke="#333333" stroke-width="0.5"/>
  
  <rect x="115" y="205" width="15" height="10" fill="#800080" stroke="#333333" stroke-width="0.5"/> <!-- T piece -->
  <rect x="115" y="215" width="15" height="10" fill="#800080" stroke="#333333" stroke-width="0.5"/>
  <rect x="130" y="215" width="15" height="10" fill="#800080" stroke="#333333" stroke-width="0.5"/>
  <rect x="100" y="215" width="15" height="10" fill="#800080" stroke="#333333" stroke-width="0.5"/>
  
  <!-- Right panel for info -->
  <rect x="170" y="25" width="60" height="200" fill="#dddddd" stroke="#333333" stroke-width="1"/>
  
  <!-- Next Piece preview box -->
  <rect x="175" y="30" width="50" height="50" fill="#222222" stroke="#333333" stroke-width="1"/>
  <text x="200" y="90" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">NEXT</text>
  
  <!-- Example next piece (L shape) -->
  <rect x="185" y="50" width="10" height="10" fill="#FF7F00" stroke="#333333" stroke-width="0.5"/>
  <rect x="185" y="60" width="10" height="10" fill="#FF7F00" stroke="#333333" stroke-width="0.5"/>
  <rect x="195" y="60" width="10" height="10" fill="#FF7F00" stroke="#333333" stroke-width="0.5"/>
  <rect x="205" y="60" width="10" height="10" fill="#FF7F00" stroke="#333333" stroke-width="0.5"/>
  
  <!-- Score display -->
  <text x="200" y="110" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">SCORE</text>
  <rect x="175" y="115" width="50" height="20" fill="white" stroke="#333333" stroke-width="1"/>
  <text x="200" y="130" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">12340</text>
  
  <!-- Level display -->
  <text x="200" y="150" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">LEVEL</text>
  <rect x="175" y="155" width="50" height="20" fill="white" stroke="#333333" stroke-width="1"/>
  <text x="200" y="170" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">5</text>
  
  <!-- Lines display -->
  <text x="200" y="190" font-family="Arial" font-size="10" fill="#333333" text-anchor="middle">LINES</text>
  <rect x="175" y="195" width="50" height="20" fill="white" stroke="#333333" stroke-width="1"/>
  <text x="200" y="210" font-family="Arial" font-size="14" fill="#333333" text-anchor="middle">42</text>
</svg>