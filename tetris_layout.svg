<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <style>
    .lbl { font: 9px sans-serif; fill: #888; }
    .dim { font: 8px monospace; fill: #d33; }
    .tag { font: 10px sans-serif; fill: #fff; }
  </style>

  <!-- 240x240 screen -->
  <rect x="20" y="30" width="240" height="240" fill="#202020" stroke="#666"/>
  <text x="20" y="24" class="lbl">240 x 240 display</text>

  <!-- board: 10x20 cells of 11px at (6,10) -->
  <rect x="26" y="40" width="110" height="220" fill="#000" stroke="#404040"/>
  <g stroke="#2a2a2a">
    <path d="M37 40v220M48 40v220M59 40v220M70 40v220M81 40v220M92 40v220M103 40v220M114 40v220M125 40v220"/>
    <path d="M26 51h110M26 62h110M26 73h110M26 84h110M26 95h110M26 106h110M26 117h110M26 128h110M26 139h110M26 150h110M26 161h110M26 172h110M26 183h110M26 194h110M26 205h110M26 216h110M26 227h110M26 238h110M26 249h110"/>
  </g>
  <!-- sample blocks, square -->
  <rect x="60" y="52" width="9" height="9" fill="#00ffff"/>
  <rect x="71" y="52" width="9" height="9" fill="#00ffff"/>
  <rect x="82" y="52" width="9" height="9" fill="#00ffff"/>
  <rect x="93" y="52" width="9" height="9" fill="#00ffff"/>
  <rect x="27" y="250" width="9" height="9" fill="#ff8000"/>
  <rect x="38" y="250" width="9" height="9" fill="#ff8000"/>
  <rect x="49" y="250" width="9" height="9" fill="#800080"/>
  <text x="81" y="155" class="tag" text-anchor="middle">BOARD</text>
  <text x="81" y="167" class="lbl" text-anchor="middle">10 x 20 cells</text>

  <!-- next piece box -->
  <rect x="177" y="58" width="46" height="46" fill="#000" stroke="#404040"/>
  <rect x="179" y="71" width="9" height="9" fill="#ffff00"/>
  <rect x="190" y="71" width="9" height="9" fill="#ffff00"/>
  <rect x="179" y="82" width="9" height="9" fill="#ffff00"/>
  <rect x="190" y="82" width="9" height="9" fill="#ffff00"/>
  <text x="200" y="49" class="tag" text-anchor="middle">NEXT</text>

  <!-- stats -->
  <text x="200" y="125" class="tag" text-anchor="middle">SCORE</text>
  <text x="200" y="139" class="lbl" text-anchor="middle">12400</text>
  <text x="200" y="165" class="tag" text-anchor="middle">LEVEL</text>
  <text x="200" y="179" class="lbl" text-anchor="middle">3</text>
  <text x="200" y="205" class="tag" text-anchor="middle">LINES</text>
  <text x="200" y="219" class="lbl" text-anchor="middle">27</text>

  <!-- dimension annotations -->
  <text x="272" y="45" class="dim">panel x=126</text>
  <text x="272" y="57" class="dim">w=108</text>
  <text x="272" y="150" class="dim">board 110x220</text>
  <text x="272" y="162" class="dim">at (6,10)</text>
  <text x="272" y="174" class="dim">cell 11x11</text>

  <!-- cell zoom -->
  <rect x="300" y="200" width="44" height="44" fill="#000" stroke="#404040"/>
  <rect x="304" y="204" width="36" height="36" fill="#00ff00"/>
  <text x="322" y="258" class="dim" text-anchor="middle">1px gutter</text>
  <text x="322" y="268" class="dim" text-anchor="middle">= grid</text>
</svg>
