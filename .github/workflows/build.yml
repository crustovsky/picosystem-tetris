name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Pinned so a build is reproducible. Pico SDK 2.3.0 is the first 2.x that
  # builds the pioasm host tool under modern GCC.
  PICO_SDK_REF: '2.3.0'
  PICOSYSTEM_REF: 'd5b83173abc13a8c55d6db94ad68179904a4f6e2'

jobs:
  picosystem:
    name: PicoSystem (.uf2)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: picosystem-tetris

      # CMakeLists finds both SDKs when they sit next to the repo
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_REF }}
          path: pico-sdk
      - uses: actions/checkout@v4
        with:
          repository: pimoroni/picosystem
          ref: ${{ env.PICOSYSTEM_REF }}
          path: picosystem

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev pkg-config

      - name: Build
        run: |
          cmake -S picosystem-tetris -B build -DUSE_PICOSYSTEM=ON
          cmake --build build -j"$(nproc)"

      - name: Report size
        run: arm-none-eabi-size build/picosystem-tetris.elf

      - uses: actions/upload-artifact@v4
        with:
          name: picosystem-tetris-uf2
          path: build/picosystem-tetris.uf2
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/picosystem-tetris.uf2
          generate_release_notes: true
